# Try the installer on a clean machine on every push: build on Ubuntu, test-install on Ubuntu and on Windows.
# Thử file cài trên máy sạch mỗi lần đẩy code: đóng gói trên Ubuntu, cài thử trên Ubuntu và trên Windows.
# GitHub counts minutes in a private repository against the account's spending, and free in a public one. So on a push the
# jobs run only in a public repository (the published one, and public forks); a private one, such as the development copy,
# skips them at once and spends nothing: its tests run on the developer's computer before each release. Started by hand
# (workflow_dispatch), they run anywhere. When they run, the two Windows jobs, which cost the most minutes, run only when a
# push changes something they test (see "Decide whether the Windows jobs run") or when the workflow is started by hand.
# GitHub tính số phút ở repo riêng tư vào mức chi của tài khoản, còn ở repo công khai thì miễn phí. Nên khi đẩy code, các việc
# chỉ chạy ở repo công khai (repo phát hành và các bản fork công khai); repo riêng tư, như bản phát triển, bỏ qua ngay và không
# tốn gì: bài kiểm của nó chạy trên máy người phát triển trước mỗi lần phát hành. Bấm chạy tay (workflow_dispatch) thì chạy ở
# mọi nơi. Khi chạy, hai việc trên Windows, tốn nhiều phút nhất, chỉ chạy khi lần đẩy đổi thứ mà chúng kiểm (xem
# "Decide whether the Windows jobs run") hoặc khi workflow được bấm chạy tay.
# Only the normal package is used (no packaging/company.json, no company send code).
# Chỉ dùng gói thường (không có packaging/company.json, không có mã gửi của công ty).
name: Test install

on:
  push:
  workflow_dispatch:

jobs:
  code-check:
    if: ${{ !github.event.repository.private || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Lint the Python code
        run: pipx run ruff==0.17.4 check .
      # tsc needs the type files Claude Code writes on a developer's computer (.claude-plugin/types, not in git),
      # so the type check runs locally; CI runs the hooks' tests with the Claude Code CLI, which needs no login
      # tsc cần file kiểu Claude Code ghi trên máy người viết (.claude-plugin/types, không có trong git),
      # nên kiểm kiểu chạy trên máy; CI chạy test của hook bằng Claude Code CLI, không cần đăng nhập
      - name: Test the hooks
        run: npx -y @anthropic-ai/claude-code@2.1.319 plugin test .
      - name: Test the server
        working-directory: server
        run: python3 -m unittest test_webhook test_demo test_mcp test_ask test_telegram_bot test_projects test_contract test_receiver test_hour_rows
      # the optional receiver in Go: the shared sample, the random test with Python as the judge, and the receiver against the real Python server
      # bộ nhận tuỳ chọn bằng Go: bộ mẫu chung, bài thử ngẫu nhiên có Python làm trọng tài, và bộ nhận chạy với máy chủ Python thật
      - uses: actions/setup-go@v5
        with:
          go-version-file: receiver/go.mod
      - name: Test the Go receiver
        working-directory: receiver
        run: go vet ./... && go test ./...
      - name: Test the connector for Codex, Cursor and Gemini CLI
        run: python3 tests/connectors/test_connectors.py
      - name: Test the meter for AI projects and applications, and its report
        run: python3 tests/appmeter/test_appmeter.py
      - name: Test the Chrome extension against the server
        run: node tests/extension/check-extension.js
      - name: Check where the maps put the office labels
        run: node tests/check-map-layout.js
  build:
    if: ${{ !github.event.repository.private || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    outputs:
      windows: ${{ steps.scope.outputs.windows }}
    steps:
      - uses: actions/checkout@v4
      # What the Windows jobs test: the installers and the package (packaging/), the connector, the menu bar app and tray script,
      # their own tests, this workflow, and the plugin's manifest, so raising the version for a release runs them too.
      # When the pushed commits cannot be compared (a new branch, a rewritten history), the jobs run.
      # Thứ các việc Windows kiểm: bộ cài và gói (packaging/), bộ nối, app thanh menu và script khay,
      # các bài test của chúng, chính workflow này, và file khai báo của plugin, để việc nâng phiên bản khi phát hành cũng chạy chúng.
      # Khi không so được các commit vừa đẩy (nhánh mới, lịch sử bị viết lại) thì các việc đó vẫn chạy.
      - name: Decide whether the Windows jobs run
        id: scope
        env:
          EVENT: ${{ github.event_name }}
          PRIVATE: ${{ github.event.repository.private }}
          BEFORE: ${{ github.event.before }}
          WINDOWS_PATHS: '^(\.github/workflows/|\.claude-plugin/|packaging/|connectors/|server/menubar/|tests/connectors/|tests/menubar/|tests/windows/)'
        run: |
          if [ "$EVENT" != "push" ] || [ "$PRIVATE" != "true" ]; then
            windows=true
          elif ! git fetch -q --depth=1 origin "$BEFORE" 2>/dev/null; then
            windows=true
          elif git diff --name-only "$BEFORE" "$GITHUB_SHA" | grep -qE "$WINDOWS_PATHS"; then
            windows=true
          else
            windows=false
          fi
          echo "windows=$windows" >> "$GITHUB_OUTPUT"
          echo "Windows jobs run: $windows"
      - name: Build the package
        run: bash packaging/build.sh
      - name: Test the private-data check
        run: bash tests/test-check-clean.sh
      - name: Check the skills' front matter
        run: python3 tests/check-frontmatter.py
      - name: Check the two-language rules
        run: python3 tests/check-i18n.py
      - name: Check the map shader and flight names
        run: python3 tests/check-maps.py
      - uses: actions/upload-artifact@v4
        with:
          name: package
          path: dist/*.zip

  ubuntu:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: package
          path: package
      - name: Unzip the package
        run: |
          mkdir -p "$RUNNER_TEMP/package"
          unzip -q package/*.zip -d "$RUNNER_TEMP/package"
      - name: Test-install the cases
        run: bash tests/linux/test-install.sh "$RUNNER_TEMP/package/AI-Worker"
      - name: Test the server install
        run: sudo bash tests/linux/test-server.sh
      - name: Test the menu bar script
        run: bash tests/menubar/test-menubar.sh
      - name: Test the Ubuntu menu bar package
        run: BADGE_OUT="$RUNNER_TEMP/badge.png" bash tests/menubar/test-deb.sh
        timeout-minutes: 15
      - name: Keep the notification badge drawn on Ubuntu
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ubuntu-badge
          path: ${{ runner.temp }}/badge.png
          if-no-files-found: ignore

  windows:
    needs: build
    if: needs.build.outputs.windows == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: package
          path: package
      - name: Unzip the package
        shell: pwsh
        run: |
          $zip = Get-ChildItem package\*.zip | Select-Object -First 1
          Expand-Archive $zip.FullName -DestinationPath "$env:RUNNER_TEMP\package"
      - name: Test-install the cases
        shell: pwsh
        run: pwsh -NoProfile -File tests/windows/test-install.ps1 -Package "$env:RUNNER_TEMP\package\AI-Worker"
      # the same test file drives the PowerShell hook and installer here
      # cùng file test đó ở đây chạy hook và bộ cài bản PowerShell
      - name: Test the connector for Codex, Cursor and Gemini CLI
        run: python tests/connectors/test_connectors.py
      - name: Test the icon next to the clock
        shell: pwsh
        run: pwsh -NoProfile -File tests/menubar/test-menubar.ps1
        env:
          BADGE_OUT: ${{ runner.temp }}\badge-windows.png
      - name: Keep the notification badge drawn on Windows
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-badge
          path: ${{ runner.temp }}\badge-windows.png
          if-no-files-found: ignore

  windows-app:
    needs: build
    if: needs.build.outputs.windows == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build AI Worker.exe
        shell: pwsh
        working-directory: server/menubar/windows-app
        run: dotnet build -c Release -o build
      - name: Build AI Worker.msi
        shell: pwsh
        working-directory: server/menubar/windows-app
        run: |
          dotnet tool install --global wix --version 5.0.2
          wix extension add -g WixToolset.UI.wixext/5.0.2 WixToolset.Util.wixext/5.0.2
          wix build AIWorker.wxs -d Version=1.0.0 -d BuildDir=build -ext WixToolset.UI.wixext -ext WixToolset.Util.wixext -o "AI Worker.msi"
          wix build AIWorker.wxs -d Version=1.0.1 -d BuildDir=build -ext WixToolset.UI.wixext -ext WixToolset.Util.wixext -o "AI Worker 1.0.1.msi"
      - name: Test install, pairing, notifications and removal
        shell: pwsh
        run: pwsh -NoProfile -File tests/menubar/test-windows-app.ps1 -Msi "server/menubar/windows-app/AI Worker.msi" -NewerMsi "server/menubar/windows-app/AI Worker 1.0.1.msi"
        timeout-minutes: 12
      - name: Keep AI Worker.msi
        uses: actions/upload-artifact@v4
        with:
          name: ai-worker-msi
          path: server/menubar/windows-app/AI Worker.msi

  # The plugin installer for staff computers (packaging/windows-msi): a thin .msi around the normal package built above,
  # with a placeholder the server fills with its address and send code. It holds no company data, so it can be built here.
  # Gói cài plugin cho máy nhân viên (packaging/windows-msi): .msi mỏng bọc gói thường dựng ở trên,
  # có chuỗi giữ chỗ để máy chủ điền địa chỉ và mã gửi. Gói không chứa dữ liệu công ty nào, nên dựng ở đây được.
  plugin-msi:
    needs: build
    if: needs.build.outputs.windows == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: package
          path: package
      - name: Build AI Worker plugin.msi
        shell: pwsh
        run: |
          dotnet tool install --global wix --version 5.0.2
          wix extension add -g WixToolset.UI.wixext/5.0.2 WixToolset.Util.wixext/5.0.2
          $zip = (Get-ChildItem package\AI-Worker-*.zip | Select-Object -First 1).FullName
          $version = (Get-Content -Raw .claude-plugin\plugin.json | ConvertFrom-Json).version
          # a copy one version higher, for the upgrade and downgrade cases of the test
          # một bản cao hơn một số, cho các tình huống nâng cấp và hạ cấp của bài thử
          $v = [version]$version; $newer = "$($v.Major).$($v.Minor).$($v.Build + 1)"
          pwsh -NoProfile -File packaging/windows-msi/build-msi.ps1 -Package $zip -Version $version -Out "dist-msi\AI Worker plugin.msi"
          pwsh -NoProfile -File packaging/windows-msi/build-msi.ps1 -Package $zip -Version $newer -Out "dist-msi\AI Worker plugin newer.msi"
      - name: Test install, setup, update, upgrade and removal
        shell: pwsh
        run: pwsh -NoProfile -File tests/windows/test-msi.ps1 -Msi "dist-msi\AI Worker plugin.msi" -NewerMsi "dist-msi\AI Worker plugin newer.msi"
        timeout-minutes: 15
      - name: Keep AI Worker plugin.msi
        uses: actions/upload-artifact@v4
        with:
          name: ai-worker-plugin-msi
          path: dist-msi/AI Worker plugin.msi
