name: Bug report
description: Something does not work as the documents say.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Do not post real names, emails, IP addresses, keys or screenshots of a real dashboard.
        A security problem goes to the Security tab, not here.
  - type: dropdown
    id: part
    attributes:
      label: Which part
      options: [Plugin on a computer, Dashboard server, Installer, Menu bar icon, Browser extension, Documents]
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: Shown in /office, or "version" in .claude-plugin/plugin.json
    validations:
      required: true
  - type: input
    id: system
    attributes:
      label: Operating system
      placeholder: macOS 15, Windows 11, Ubuntu 24.04 (Wayland)...
  - type: textarea
    id: steps
    attributes:
      label: Steps to see the problem
      placeholder: "1. ...\n2. ...\n3. ..."
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected, and what happened instead
    validations:
      required: true
