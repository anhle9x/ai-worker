<rect width="900" height="685" rx="12" fill="#0d1117"/>
<rect x="20" y="30" width="250" height="190" rx="10" fill="#161b22" stroke="#3fb950" stroke-width="1.5"/><text x="36" y="58" font-size="15" font-weight="600" fill="#e6edf3">Máy nhân viên</text><text x="36" y="82" font-size="13" fill="#9da7b3">Claude Code + plugin ai-worker</text><text x="36" y="102" font-size="13" fill="#9da7b3">Bộ nối: Codex, Cursor, Gemini CLI</text><text x="36" y="122" font-size="13" fill="#9da7b3">Skill, quy tắc, trang văn phòng</text><text x="36" y="142" font-size="13" fill="#9da7b3">Trợ lý phụ: Gemini, ChatGPT, Gemma</text><text x="36" y="162" font-size="13" fill="#9da7b3">Hỏi trước: lệnh rủi ro,</text><text x="36" y="182" font-size="13" fill="#9da7b3">commit có bí mật</text><text x="36" y="202" font-size="13" fill="#9da7b3">Báo trang tìm cách lái Claude</text><line x1="145" y1="220" x2="145" y2="248" stroke="#30363d" stroke-width="1.5" stroke-dasharray="4 3"/><rect x="20" y="250" width="250" height="130" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1.5"/><text x="36" y="278" font-size="15" font-weight="600" fill="#e6edf3">Dữ liệu gửi đi</text><text x="36" y="302" font-size="13" fill="#9da7b3">Tên, tài khoản, thông tin máy</text><text x="36" y="322" font-size="13" fill="#9da7b3">Phiên, token, chi phí, việc giao</text><text x="36" y="342" font-size="13" fill="#9da7b3">Số lần ai-worker đã chặn</text><text x="36" y="362" font-size="13" fill="#9da7b3">Không gửi chat, câu hỏi, tên file</text><line x1="145" y1="380" x2="145" y2="408" stroke="#30363d" stroke-width="1.5" stroke-dasharray="4 3"/><rect x="20" y="410" width="250" height="110" rx="10" fill="#161b22" stroke="#f0883e" stroke-width="1.5"/><text x="36" y="438" font-size="15" font-weight="600" fill="#e6edf3">Chữ gửi ChatGPT, Gemini</text><text x="36" y="462" font-size="13" fill="#9da7b3">Hỏi trước nếu chưa cho phép</text><text x="36" y="482" font-size="13" fill="#9da7b3">Không gửi khi có khoá, token</text><text x="36" y="502" font-size="13" fill="#9da7b3">hay mật khẩu bên trong</text><rect x="345" y="30" width="230" height="630" rx="10" fill="#161b22" stroke="#a371f7" stroke-width="1.5"/><text x="361" y="58" font-size="15" font-weight="600" fill="#e6edf3">Máy chủ bảng tổng</text><text x="361" y="82" font-size="13" fill="#9da7b3">Một máy Linux</text><text x="361" y="102" font-size="13" fill="#9da7b3">Python, thư viện chuẩn</text><text x="361" y="122" font-size="13" fill="#9da7b3">Caddy: HTTPS + IP văn phòng</text><text x="361" y="142" font-size="13" fill="#9da7b3">SQLite: board.db</text><text x="361" y="162" font-size="13" fill="#9da7b3">accounts.db để riêng</text><text x="361" y="182" font-size="13" fill="#9da7b3">Số liệu theo ngày, 13 tháng</text><text x="361" y="202" font-size="13" fill="#9da7b3">Bản cập nhật có chữ ký</text><text x="361" y="222" font-size="13" fill="#9da7b3">Nhật ký quản trị 12 tháng,</text><text x="361" y="242" font-size="13" fill="#9da7b3">mỗi dòng nối với dòng trước</text><text x="361" y="262" font-size="13" fill="#9da7b3">Trang Quản trị: đếm lần chặn,</text><text x="361" y="282" font-size="13" fill="#9da7b3">chỉ ra khoá MCP bỏ quên</text><rect x="650" y="30" width="230" height="58" rx="10" fill="#161b22" stroke="#3fb950" stroke-width="1.5"/><text x="666" y="58" font-size="15" font-weight="600" fill="#e6edf3">Bảng tổng (trình duyệt)</text><text x="666" y="76" font-size="13" fill="#9da7b3">Quản lý · OTP hoặc Telegram</text><line x1="577" y1="59" x2="648" y2="59" stroke="#9da7b3" stroke-width="1.5" marker-end="url(#a)"/><rect x="650" y="100" width="230" height="58" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1.5"/><text x="666" y="128" font-size="15" font-weight="600" fill="#e6edf3">Màn hình treo tường</text><text x="666" y="146" font-size="13" fill="#9da7b3">Ghép bằng mã · không hiện email</text><line x1="577" y1="129" x2="648" y2="129" stroke="#9da7b3" stroke-width="1.5" marker-end="url(#a)"/><rect x="650" y="170" width="230" height="58" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1.5"/><text x="666" y=