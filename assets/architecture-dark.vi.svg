 x1="343" y1="130" x2="272" y2="130" stroke="#9da7b3" stroke-width="1.5" marker-end="url(#a)"/><text x="307" y="148" font-size="12" fill="#9da7b3" text-anchor="middle">cập nhật</text><text x="361" y="302" font-size="13" fill="#9da7b3">Dự án AI (AI_PROJECTS=1):</text><text x="361" y="322" font-size="13" fill="#9da7b3">lượt 30 ngày, báo cáo, PDF, CSV</text><rect x="650" y="520" width="230" height="58" rx="10" fill="#161b22" stroke="#4493f8" stroke-width="1.5"/><text x="666" y="548" font-size="15" font-weight="600" fill="#e6edf3">Trang Dự án AI</text><text x="666" y="566" font-size="13" fill="#9da7b3">Báo cáo, in ra PDF, CSV</text><line x1="577" y1="549" x2="648" y2="549" stroke="#9da7b3" stroke-width="1.5" marker-end="url(#a)"/><rect x="20" y="550" width="250" height="110" rx="10" fill="#161b22" stroke="#4493f8" stroke-width="1.5"/><text x="36" y="578" font-size="15" font-weight="600" fill="#e6edf3">Dự án AI của nhóm</text><text x="36" y="602" font-size="13" fill="#9da7b3">Mọi ngôn ngữ, mọi hãng LLM</text><text x="36" y="622" font-size="13" fill="#9da7b3">Bộ đo một file: thời gian, token</text><text x="36" y="642" font-size="13" fill="#9da7b3">Không bao giờ có câu hỏi, trả lời</text><line x1="272" y1="605" x2="343" y2="605" stroke="#9da7b3" stroke-width="1.5" marker-end="url(#a)"/><text x="307" y="597" font-size="12" fill="#9da7b3" text-anchor="middle">số đo</text><text x="307" y="622" font-size="12" fill="#9da7b3" text-anchor="middle">khoá riêng</text></svg>
