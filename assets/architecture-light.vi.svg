<rect x="20" y="30" width="250" height="190" rx="10" fill="#f6f8fa" stroke="#1a7f37" stroke-width="1.5"/><text x="36" y="58" font-size="15" font-weight="600" fill="#1f2328">Máy nhân viên</text><text x="36" y="82" font-size="13" fill="#59636e">Claude Code + plugin ai-worker</text><text x="36" y="102" font-size="13" fill="#59636e">Bộ nối: Codex, Cursor, Gemini CLI</text><text x="36" y="122" font-size="13" fill="#59636e">Skill, quy tắc, trang văn phòng</text><text x="36" y="142" font-size="13" fill="#59636e">Trợ lý phụ: Gemini, ChatGPT, Gemma</text><text x="36" y="162" font-size="13" fill="#59636e">Hỏi trước: lệnh rủi ro,</text><text x="36" y="182" font-size="13" fill="#59636e">commit có bí mật</text><text x="36" y="202" font-size="13" fill="#59636e">Báo trang tìm cách lái Claude</text><line x1="145" y1="220" x2="145" y2="248" stroke="#d0d7de" stroke-width="1.5" stroke-dasharray="4 3"/><rect x="20" y="250" width="250" height="130" rx="10" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.5"/><text x="36" y="278" font-size="15" font-weight="600" fill="#1f2328">Dữ liệu gửi đi</text><text x="36" y="302" font-size="13" fill="#59636e">Tên, tài khoản, thông tin máy</text><text x="36" y="322" font-size="13" fill="#59636e">Phiên, token, chi phí, việc giao</text><text x="36" y="342" font-size="13" fill="#59636e">Số lần ai-worker đã chặn</text><text x="36" y="362" font-size="13" fill="#59636e">Không gửi chat, câu hỏi, tên file</text><line x1="145" y1="380" x2="145" y2="408" stroke="#d0d7de" stroke-width="1.5" stroke-dasharray="4 3"/><rect x="20" y="410" width="250" height="110" rx="10" fill="#f6f8fa" stroke="#bc4c00" stroke-width="1.5"/><text x="36" y="438" font-size="15" font-weight="600" fill="#1f2328">Chữ gửi ChatGPT, Gemini</text><text x="36" y="462" font-size="13" fill="#59636e">Hỏi trước nếu chưa cho phép</text><text x="36" y="482" font-size="13" fill="#59636e">Không gửi khi có khoá, token</text><text x="36" y="502" font-size="13" fill="#59636e">hay mật khẩu bên trong</text>