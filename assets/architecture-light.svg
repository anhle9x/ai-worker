<rect x="20" y="30" width="250" height="130" rx="10" fill="#f6f8fa" stroke="#1a7f37" stroke-width="1.5"/><text x="36" y="58" font-size="15" font-weight="600" fill="#1f2328">Employee computer</text><text x="36" y="82" font-size="13" fill="#59636e">Claude Code + ai-worker plugin</text><text x="36" y="102" font-size="13" fill="#59636e">Connector: Codex, Cursor, Gemini CLI</text><text x="36" y="122" font-size="13" fill="#59636e">Skills, rules, office page</text><text x="36" y="142" font-size="13" fill="#59636e">Helpers: Gemini, ChatGPT, Gemma</text><rect x="20" y="190" width="250" height="110" rx="10" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.5"/><text x="36" y="218" font-size="15" font-weight="600" fill="#1f2328">What is sent</text><text x="36" y="242" font-size="13" fill="#59636e">Name, account, device details</text><text x="36" y="262" font-size="13" fill="#59636e">Sessions, tokens, cost, tasks</text><text x="36" y="282" font-size="13" fill="#59636e">Never chat, prompts or file names</text><rect x="345" y="30" width="230" height="408" rx="10" fill="#f6f8fa" stroke="#8250df" stroke-width="1.5"/><text x="361" y="58" font-size="15" font-weight="600" fill="#1f2328">Dashboard server</text><text x="361" y="82" font-size="13" fill="#59636e">One Linux machine</text><text x="361" y="102" font-size="13" fill="#59636e">Python, standard library</text><text x="361" y="122" font-size="13" fill="#59636e">Caddy: HTTPS + office IPs</text><text x="361" y="142" font-size="13" fill="#59636e">SQLite: board.db</text><text x="361" y="162" font-size="13" fill="#59636e">accounts.db kept apart</text><text x="361" y="182" font-size="13" fill="#59636e">Daily totals, 13 months</text><text x="361" y="202" font-size="13" fill="#59636e">Signed updates</text><text x="361" y="222" font-size="13" fill="#59636e">Audit log, 12 months</text><rect x="650" y="30" width="230" height="58" rx="10" fill="#f6f8fa" stroke="#1a7f37" stroke-width="1.5"/><text x="666" y="58" font-size="15" font-weight="600" fill="#1f2328">Dashboard (browser)</text><text x="666" y="76" font-size="13" fill="#59636e">Managers · OTP or Telegram</text><line x1="577" y1="59" x2="648" y2="59" stroke="#59636e" stroke-width="1.5" marker-end="url(#a)"/><rect x="650" y="100" width="230" height="58" rx="10" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.5"/><text x="666" y="128" font-size="15" font-weight="600" fill="#1f2328">TV wall screen</text><text x="666" y="146" font-size="13" fill="#59636e">Paired by code · no emails</text><line x1="577" y1="129" x2="648" y2="129" stroke="#59636e" stroke-width="1.5" marker-end="url(#a)"/><rect x="650" y="170" width="230" height="58" rx="10" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.5"/><text x="666" y="198" font-size="15" font-weight="600" fill="#1f2328">Menu bar icon</text><text x="666" y="216" font-size="13" fill="#59636e">macOS · Windows · Ubuntu</text><line x1="577" y1="199" x2="648" y2="199" stroke="#59636e" stroke-width="1.5" marker-end="url(#a)"/><rect x="650" y="240" width="230" height="58" rx="10" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.5"/><text x="666" y="268" font-size="15" font-weight="600" fill="#1f2328">Browser extension</text><text x="666" y="286" font-size="13" fill="#59636e">Chrome · waiting count</text><line x1="577" y1="269" x2="648" y2="269" stroke="#59636e" stroke-width="1.5" marker-end="url(#a)"/><rect x="650" y="310" width="230" height="58" rx="10" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.5"/><text x="666" y="338" font-size="15" font-weight="600" fill="#1f2328">AI tools over MCP</text><text x="666" y="356" font-size="13" fill="#59636e">Read-only · key an admin approves</text><line x1="577" y1="339" x2="648" y2="339" stroke="#59636e" stroke-width="1.5" marker-end="url(#a)"/><rect x="650" y="380" width="230" height="58" rx="10" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.5"/><text x="666" y="408" font-size="15" font-weight="600" fill="#1f2328">Telegram chat</text><text x="666" y="426" font-size="13" fill="#59636e">Optional · buttons, no AI model</text><line x1="577" y1="409" x2="648" y2="409" stroke="#59636e" stroke-width="1.5" marker-end="url(#a)"/><line x1="272" y1="80" x2="343" y2="80" stroke="#59636e" stroke-width="1.5" marker-end="url(#a)"/><text x="307" y="72" font-size="12" fill="#59636e" text-anchor="middle">numbers</text><line x1="343" y1="130" x2="272" y2="130" stroke="#59636e" stroke-width="1.5" marker-end="url(#a)"/><text x="307" y="148" font-size="12" fill="#59636e" text-anchor="middle">updates</text><line x1="145" y1="160" x2="145" y2="188" stroke="#d0d7de" stroke-width="1.5" stroke-dasharray="4 3"/></svg>
