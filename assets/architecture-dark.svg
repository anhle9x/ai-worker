<svg xmlns="http://www.w3.org/2000/svg" width="900" height="545" viewBox="0 0 900 545" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#9da7b3"/></marker></defs>
<rect width="900" height="545" rx="12" fill="#0d1117"/>
<rect x="20" y="30" width="250" height="190" rx="10" fill="#161b22" stroke="#3fb950" stroke-width="1.5"/><text x="36" y="58" font-size="15" font-weight="600" fill="#e6edf3">Employee computer</text><text x="36" y="82" font-size="13" fill="#9da7b3">Claude Code + ai-worker plugin</text><text x="36" y="102" font-size="13" fill="#9da7b3">Connector: Codex, Cursor, Gemini CLI</text><text x="36" y="122" font-size="13" fill="#9da7b3">Skills, rules, office page</text><text x="36" y="142" font-size="13" fill="#9da7b3">Helpers: Gemini, ChatGPT, Gemma</text><text x="36" y="162" font-size="13" fill="#9da7b3">Asks first: risky commands,</text><text x="36" y="182" font-size="13" fill="#9da7b3">commits with secrets</text><text x="36" y="202" font-size="13" fill="#9da7b3">Flags pages that steer Claude</text><line x1="145" y1="220" x2="145" y2="248" stroke="#30363d" stroke-width="1.5" stroke-dasharray="4 3"/><rect x="20" y="250" width="250" height="130" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1.5"/><text x="36" y="278" font-size="15" font-weight="600" fill="#e6edf3">What is sent</text><text x="36" y="302" font-size="13" fill="#9da7b3">Name, account, device details</text><text x="36" y="322" font-size="13" fill="#9da7b3">Sessions, tokens, cost, tasks</text><text x="36" y="342" font-size="13" fill="#9da7b3">How often ai-worker stopped</text><text x="36" y="362" font-size="13" fill="#9da7b3">Never chat, prompts or file names</text><line x1="145" y1="380" x2="145" y2="408" stroke="#30363d" stroke-width="1.5" stroke-dasharray="4 3"/><rect x="20" y="410" width="250" height="110" rx="10" fill="#161b22" stroke="#f0883e" stroke-width="1.5"/><text x="36" y="438" font-size="15" font-weight="600" fill="#e6edf3">Text for ChatGPT, Gemini</text><text x="36" y="462" font-size="13" fill="#9da7b3">Asked first unless allowed</text><text x="36" y="482" font-size="13" fill="#9da7b3">Never sent with a key, a token</text><text x="36" y="502" font-size="13" fill="#9da7b3">or a password in it</text><rect x="345" y="30" width="230" height="490" rx="10" fill="#161b22" stroke="#a371f7" stroke-width="1.5"/><text x="361" y="58" font-size="15" font-weight="600" fill="#e6edf3">Dashboard server</text><text x="361" y="82" font-size="13" fill="#9da7b3">One Linux machine</text><text x="361" y="102" font-size="13" fill="#9da7b3">Python, standard library</text><text x="361" y="122" font-size="13" fill="#9da7b3">Caddy: HTTPS + office IPs</text><text x="361" y="142" font-size="13" fill="#9da7b3">SQLite: board.db</text><text x="361" y="162" font-size="13" fill="#9da7b3">accounts.db kept apart</text><text x="361" y="182" font-size="13" fill="#9da7b3">Daily totals, 13 months</text><text x="361" y="202" font-size="13" fill="#9da7b3">Signed updates</text><text x="361" y="222" font-size="13" fill="#9da7b3">Audit log, 12 months,</text><text x="361" y="242" font-size="13" fill="#9da7b3">each line chained to the last</text><text x="361" y="262" font-size="13" fill="#9da7b3">Admin page: stops counted,</text><text x="361" y="282" font-size="13" fill="#9da7b3">unused MCP keys flagged</text><rect x="650" y="30" width="230" height="58" rx="10" fill="#161b22" stroke="#3fb950" stroke-width="1.5"/><text x="666" y="58" font-size="15" font-weight="600" fill="#e6edf3">Dashboard (browser)</text><text x="666" y="76" font-size="13" fill="#9da7b3">Managers · OTP or Telegram</text><line x1="577" y1="59" x2="648" y2="59" stroke="#9da7b3" stroke-width="1.5" marker-end="url(#a)"/><rect x="650" y="100" width="230" height="58" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1.5"/><text x="666" y="128" font-size="15" font-weight="600" fill="#e6edf3">TV wall screen</text><text x="666" y="146" font-size="13" fill="#9da7b3">Paired by code · no emails</text><line x1="577" y1="129" x2="648" y2="129" stroke="#9da7b3" stroke-width="1.5" marker-end="url(#a)"/><rect x="650" y="170" width="230" height="58" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1.5"/><text x="666" y="198" font-size="15" font-weight="600" fill="#e6edf3">Menu bar icon</text><text x="666" y="216" font-size="13" fill="#9da7b3">macOS · Windows · Ubuntu</text><line x1="577" y1="199" x2="648" y2="199" stroke="#9da7b3" stroke-width="1.5" marker-end="url(#a)"/><rect x="650" y="240" width="230" height="58" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1.5"/><text x="666" y="268" font-size="15" font-weight="600" fill="#e6edf3">Browser extension</text><text x="666" y="286" font-size="13" fill="#9da7b3">Chrome · waiting count</text><line x1="577" y1="269" x2="648" y2="269" stroke="#9da7b3" stroke-width="1.5" marker-end="url(#a)"/><rect x="650" y="310" width="230" height="58" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1.5"/><text x="666" y="338" font-size="15" font-weight="600" fill="#e6edf3">AI tools over MCP</text><text x="666" y="356" font-size="13" fill="#9da7b3">Read-only · key an admin approves</text><line x1="577" y1="339" x2="648" y2="339" stroke="#9da7b3" stroke-width="1.5" marker-end="url(#a)"/><rect x="650" y="380" width="230" height="58" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1.5"/><text x="666" y="408" font-size="15" font-weight="600" fill="#e6edf3">Telegram bot</text><text x="666" y="426" font-size="13" fill="#9da7b3">Optional · answers, alerts</text><line x1="577" y1="409" x2="648" y2="409" stroke="#9da7b3" stroke-width="1.5" marker-end="url(#a)"/><rect x="650" y="450" width="230" height="58" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1.5"/><text x="666" y="478" font-size="15" font-weight="600" fill="#e6edf3">Window inside Telegram</text><text x="666" y="496" font-size="13" fill="#9da7b3">Phone opens /tg/ over HTTPS</text><line x1="577" y1="479" x2="648" y2="479" stroke="#9da7b3" stroke-width="1.5" marker-end="url(#a)"/><line x1="272" y1="80" x2="343" y2="80" stroke="#9da7b3" stroke-width="1.5" marker-end="url(#a)"/><text x="307" y="72" font-size="12" fill="#9da7b3" text-anchor="middle">numbers</text><line x1="343" y1="130" x2="272" y2="130" stroke="#9da7b3" stroke-width="1.5" marker-end="url(#a)"/><text x="307" y="148" font-size="12" fill="#9da7b3" text-anchor="middle">updates</text></svg>
